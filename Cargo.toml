[package]
name = "org-typst-math-helper"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "org-typst-math-helper"
path = "helper/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tylax = { version = "=0.3.8", default-features = false }
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts"] }
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"

[profile.dev]
debug = 0
